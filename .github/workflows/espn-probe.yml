name: espn-probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ESPN reachable from GitHub runners?
        run: |
          for u in \
            "https://site.web.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard" \
            "https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard" \
            "https://site.web.api.espn.com/apis/site/v2/sports/soccer/fra.1/standings" \
            "https://a.espncdn.com/i/teamlogos/soccer/500/160.png" \
            "https://sports.core.api.espn.com/v2/sports/soccer/leagues?limit=5"; do
            code=$(curl -s -m 20 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "$u")
            echo "$code  $u"
          done
